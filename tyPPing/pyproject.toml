[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typping"
version = "1.0.0"
description = "Bioinformatic tool for phage-plasmid (P-P) detection and typing"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "typer>=0.9",
    "biopython>=1.80",
]

[project.scripts]
typping = "typping.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/typping"]

[tool.pytest.ini_options]
testpaths = ["tests"]
